# Fuzz targets for the code that reads what arrives from outside: messages, mbox files, HTML,
# iCalendar, vCard, .pst files, OpenPGP signatures and keys, S/MIME Digital signatures, mailbox files, character sets, IMAP/SMTP servers, JMAP servers, gpg-agent and language catalogues. Not part of the
# main workspace (it needs nightly): `cargo +nightly fuzz run <target>` from the repository root;
# `cargo fuzz list` names them.
[package]
name = "mailcraft-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
mailcraft-assuan = { path = "../crates/assuan" }
mailcraft-dav = { path = "../crates/dav" }
# Mailbox files in every form (`mailbox_file`), with the small limits of its tests.
mailcraft-engine = { path = "../crates/engine", features = ["test-support"] }
libfuzzer-sys = "0.4"
mailcraft-charset = { path = "../crates/charset" }
mailcraft-i18n = { path = "../crates/i18n" }
mailcraft-html = { path = "../crates/html" }
mailcraft-ical = { path = "../crates/ical" }
mailcraft-jmap = { path = "../crates/jmap" }
mailcraft-ews = { path = "../crates/ews" }
mailcraft-link = { path = "../crates/link" }
mailcraft-mime = { path = "../crates/mime" }
mailcraft-model = { path = "../crates/model" }
mailcraft-openpgp = { path = "../crates/openpgp" }
mailcraft-proto = { path = "../crates/proto" }
mailcraft-pst = { path = "../crates/pst" }
mailcraft-smime = { path = "../crates/smime" }
mailcraft-vcard = { path = "../crates/vcard" }

# Its own workspace, so the main one's builds, lints and cargo-deny leave it alone.
[workspace]

[[bin]]
name = "mime"
path = "fuzz_targets/mime.rs"
test = false
doc = false
bench = false

