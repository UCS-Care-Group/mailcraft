<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>MailCraft</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/hicolor/64x64/apps/io.github.billsecond.mailcraft.png" />
  <link data-trunk rel="rust" data-bin="mailcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #mailcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #mailcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
    /* Before the app paints: the page already follows the system's light or dark appearance. */
    @media (prefers-color-scheme: dark) {
      html, body { background: #1f1f1f; }
      #mailcraft_loading { color: #aaa; }
    }
  </style>
</head>
<body>
  <canvas id="mailcraft_canvas"></canvas>
  <div id="mailcraft_loading">Loading MailCraft&hellip;</div>
</body>
</html>
