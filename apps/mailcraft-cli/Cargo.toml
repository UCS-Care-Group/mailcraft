[package]
name = "mailcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "MailCraft command line: inspect, import, export, convert, run commands, Send/Receive, MCP server"

[[bin]]
name = "mailcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mailcraft-time = { workspace = true }
mailcraft-model = { workspace = true }
mailcraft-engine = { workspace = true }
mailcraft-mcp = { workspace = true }
mailcraft-net = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The fake mail servers of `crates/net` (included by path in `tests/two_way.rs`) speak base64 (`mailcraft-charset`).
mailcraft-charset = { workspace = true }
# The Graph stand-in, for `tests/graph_folders.rs`: in a test's build only.
mailcraft-net = { workspace = true, features = ["stand-in"] }
# The JMAP client and its server in the process, for `tests/jmap_mail.rs` and `tests/jmap_loopback.rs`:
# in a test's build only.
mailcraft-jmap = { workspace = true, features = ["stand-in"] }
