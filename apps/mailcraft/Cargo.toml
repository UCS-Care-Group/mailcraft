[package]
name = "mailcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "mailcraft"
description = "MailCraft desktop app"

[lints]
workspace = true

[dependencies]
mailcraft-time = { workspace = true }
mailcraft-model = { workspace = true }
mailcraft-engine = { workspace = true }
image = { workspace = true }
mailcraft-ui-egui = { workspace = true }
# The control key file's location (shared with the MCP bridge).
mailcraft-control-key = { workspace = true }
# Sockets: Send/Receive runs on a background thread.
mailcraft-net = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Quitting the platform's own way: on macOS `-[NSApplication terminate:]` and an app menu whose
# Quit asks first; elsewhere it does nothing (`quit.rs`).
craft-quit = { workspace = true }
# The system's language (the interface's when it is left on Automatic).
sys-locale = "0.3"

[dev-dependencies]
# The tests run the whole way of a calendar change, and of reading Outlook's Favorites, against
# a stand-in for Microsoft Graph that takes only what the documented service takes
# (`mailcraft_net::graph::standin`).
mailcraft-net = { workspace = true, features = ["stand-in"] }
# A sign-in the provider refuses, as `mailcraft-net` says it.
mailcraft-proto = { workspace = true }
# A release signed with a key made in the test, for the stand-in release server (`update_flow`).
ring = { workspace = true }
base64 = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for mailcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click, Open With, Dock drops and `open -a MailCraft note.eml` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This audited crate (also used by
# WordCraft, PdfCraft and PhotoCraft) registers the handler (Objective-C interop needs unsafe,
# which our workspace forbids) behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"
# The macOS keychain (the owner's login keychain), for the credential store below.
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# Desktop alerts through the UserNotifications framework (`alerts.rs`), through the generated
# bindings' safe calls only. objc2, its Foundation and block2 are already in the tree (the GUI
# stack's); the UserNotifications bindings are the same project's (MIT, Zlib or Apache-2.0).
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNUserNotificationCenter",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNNotificationTrigger",
] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# A password or sign-in the owner asks to be remembered goes to the operating system's credential
# store (Windows Credential Manager, the macOS keychain), never to a file of ours. keyring-core is
# the keyring crate's API: keyring 4 is only a wrapper over it and the stores named here, and its
# documentation tells programs to link those instead. Each system's store is a crate of its own.
keyring-core = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Credential Manager, for the credential store above.
windows-native-keyring-store = "1.1"
# Two registry values read, never written: where the `.msi` put the program (whether this copy
# updates itself) and an organisation's policy that turns updating off (`install.rs`, `updater.rs`).
winreg = "0.55"
# Desktop alerts as toasts (`alerts.rs`): Windows.UI.Notifications and the XML they are made of.
# Already in the tree (the GUI stack's), the same version; only these features are added.
windows = { version = "0.62", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# On Linux and FreeBSD the store is the desktop's Secret Service (GNOME Keyring, KWallet,
# KeePassXC…), spoken to over D-Bus. These features keep it pure Rust: zbus rather than libdbus,
# so neither building nor installing needs a system library, and the secret travels to the
# service encrypted (a Diffie-Hellman session, RustCrypto) rather than in the clear.
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
# Under Wayland the clipboard is the compositor's (its data-control protocol, which KDE Plasma
# and the wlroots compositors have); where it isn't offered (GNOME), arboard falls back to the
# X11 clipboard through XWayland.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control", "image-data"] }
# A program started from MailCraft (the browser, for a sign-in or a link) only comes in front
# when it is handed an activation token (xdg-activation under Wayland, startup notification under
# X11), which the window asks winit for and winit hands back as a window event that eframe drops
# (`browser.rs`). Already in the tree: eframe runs on it; the same version and features.
# GNOME draws no title bars for Wayland windows, so winit draws one: its Adwaita one, buttons
# drawn, without the title (that would bring in ttf-parser, which `cargo deny` refuses) (#207).
winit = { version = "0.30", default-features = false, features = ["wayland", "x11", "wayland-csd-adwaita-notitle"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
# "Use system setting" follows the desktop's light or dark preference, which winit doesn't report
# on these systems: read from the XDG desktop portal's settings over the session's D-Bus, and
# followed as it changes (`desktop_theme.rs`, #73). Already in the tree (accesskit's, the Secret
# Service store's): the blocking calls on its own async-io runtime, nothing more.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
# Waits for an `rfd::AsyncFileDialog` on a background thread (the dialogs don't block the UI);
# rfd itself already depends on it.
pollster = "0.4"
# The control server's random key.
getrandom = "0.3"
# Opens Microsoft's sign-in and approval pages in the system's browser, and says when no browser
# could be started (egui's own way of opening a link doesn't). Already in the tree: eframe's
# `links` feature runs on it.
webbrowser = "1.2"
# Opens an attachment the owner asked to open with the system's program for its kind (#126):
# ShellExecute on Windows, `open` on macOS, `xdg-open` and the like elsewhere, never through a
# shell. Already in the tree (egui_kittest's).
open = { version = "5.4", features = ["shellexecute-on-windows"] }
# The system's clipboard with HTML on it, for copying and pasting formatted text in a message
# being written (egui's own clipboard carries text only). Already in the tree: egui's window
# layer copies text through it.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
