[package]
name = "mailcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "mailcraft"
description = "MailCraft desktop app"

[lints]
workspace = true

[dependencies]
mailcraft-time = { workspace = true }
mailcraft-model = { workspace = true }
mailcraft-engine = { workspace = true }
mailcraft-ui-egui = { workspace = true }
# The control key file's location (shared with the MCP bridge).
mailcraft-control-key = { workspace = true }
# Sockets: Send/Receive runs on a background thread.
mailcraft-net = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# The tests run the whole way of a calendar change, and of reading Outlook's Favorites either
# way, against stand-ins for Microsoft Graph and Exchange Web Services that take only what the
# documented services take (`mailcraft_net::graph::standin`, `mailcraft_net::ews::standin`).
mailcraft-net = { workspace = true, features = ["stand-in"] }

[build-dependencies]
# Icon + VERSIONINFO for mailcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click, Open With, Dock drops and `open -a MailCraft note.eml` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This audited crate (also used by
# WordCraft, PdfCraft and PhotoCraft) registers the handler (Objective-C interop needs unsafe,
# which our workspace forbids) behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# A password or sign-in the owner asks to be remembered goes to the operating system's credential
# store (Windows Credential Manager, the macOS keychain), never to a file of ours.
keyring = { version = "3.6", default-features = false, features = ["windows-native", "apple-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
# GNOME on Wayland leaves the title bar's buttons to the program. Without this, winit (eframe's,
# already in the tree; this only turns on a feature of it) draws them as plain squares with no
# glyph; with it, sctk-adwaita draws GNOME's own close, maximize and minimize buttons in code.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }
# A password or sign-in the owner asks to be remembered goes to the Secret Service (GNOME Keyring,
# KWallet, KeePassXC) over D-Bus. MIT OR Apache-2.0. Chosen over keyring's own Secret Service
# backends: `sync-secret-service` links the C libdbus, and `async-secret-service` pulls zbus 4 in
# beside the zbus 5 already in the tree (accesskit's). This is zbus 5, Rust throughout, its
# encryption the RustCrypto crates.
secret-service = { version = "5.1", features = ["rt-async-io-crypto-rust"] }
# "Use system setting" for the interface theme: winit reports no light or dark here, so the
# desktop's own (the freedesktop.org settings portal's `color-scheme`) is read and followed over
# D-Bus. The zbus 5 already in the tree (accesskit's, secret-service's). MIT.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
# Waits for an `rfd::AsyncFileDialog` on a background thread (the dialogs don't block the UI);
# rfd itself already depends on it.
pollster = "0.4"
# The control server's random key.
getrandom = "0.3"
# Opens Microsoft's sign-in and approval pages in the system's browser, and says when no browser
# could be started (egui's own way of opening a link doesn't). Already in the tree: eframe's
# `links` feature runs on it.
webbrowser = "1.2"
# The system's notifications for new mail and reminders: the freedesktop.org notification service
# on Linux and the BSDs (zbus 5, Rust throughout, already in the tree), toasts on Windows
# (tauri-winrt-notification), the Notification Center on macOS (mac-notification-sys). MIT OR
# Apache-2.0.
notify-rust = "4.18"
