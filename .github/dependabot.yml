# Dependabot keeps the pinned GitHub Actions current: every third-party `uses:` in
# .github/workflows is a full commit SHA with its tag as a comment, and Dependabot moves both.
# It also proposes updates to the Rust crates (the workspace lock and the fuzz targets' own lock),
# so a fix for an advisory arrives as a pull request that CI (cargo-deny included) and a reviewer
# see; CODEOWNERS asks the owners to review every Cargo.lock change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release waits a week before it is proposed, so a compromised one has time to be noticed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      crates:
        patterns: ["*"]
    # The OpenPGP crypto crates move together, by hand: a new `sha2`, `sha1`, `sha3` or `rand`
    # needs a `digest` and `rand_core` that `mailcraft-openpgp`'s `rsa` 0.9 doesn't take, so a
    # bump on its own doesn't build (#955). Lift this once #988 has moved them.
    ignore:
      - dependency-name: "sha1"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha3"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rsa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ed25519-dalek"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      fuzz-crates:
        patterns: ["*"]
    # The same crypto crates as above, for the same reason (#988).
    ignore:
      - dependency-name: "sha1"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sha3"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rsa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "ed25519-dalek"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
