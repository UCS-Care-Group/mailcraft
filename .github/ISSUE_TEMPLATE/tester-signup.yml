name: Sign up to test
description: Use MailCraft on your own mail and tell us what goes wrong. For the public beta.
title: "Tester: <your GitHub name>"
labels: ["tester"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. This issue is **public**: don't write your email address, your organisation's name or anything from your mail here. Your GitHub name is enough; we'll reach you here.

        **The public beta** is now: the builds on the [Releases page](https://github.com/UCS-Care-Group/mailcraft/releases), not yet signed, and they can still get things wrong. What you do in MailCraft (moves, deletions, read marks) reaches your server. Keep Outlook or Outlook on the web to hand, and don't test on a mailbox you can't afford to have disturbed.

        **Leaving beta** takes at least 5 testers, each on a Microsoft account, using MailCraft on 14 working days (Monday to Friday) on at least 2 devices with nothing lost, and signed builds. See [ROADMAP.md](https://github.com/UCS-Care-Group/mailcraft/blob/main/ROADMAP.md).
  - type: checkboxes
    id: phase
    attributes:
      label: When can you test?
      options:
        - label: Now, as much or as little as I like
        - label: The beta run: 14 working days (about three weeks) on at least 2 devices
  - type: checkboxes
    id: platforms
    attributes:
      label: Where would you run it?
      description: Tick every one you could use daily.
      options:
        - label: Windows x64
        - label: Windows ARM64
        - label: macOS, Apple silicon
        - label: macOS, Intel
        - label: Linux x86_64
        - label: Linux ARM64
        - label: FreeBSD
  - type: input
    id: linux
    attributes:
      label: If Linux, which distribution and desktop?
      placeholder: e.g. Ubuntu 24.04, GNOME
  - type: dropdown
    id: account
    attributes:
      label: Which kind of mail account?
      description: The beta is for Microsoft accounts. Other accounts are welcome too, outside the beta run.
      multiple: true
      options:
        - Personal Microsoft account (Outlook.com, Hotmail, Live)
        - Work or school Microsoft 365 account
        - Other (Gmail, Fastmail, an IMAP server)
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: For a work or school account, can you approve apps for your organisation?
      description: Until MailCraft's registration is publisher-verified, most organisations need an administrator to approve it once.
      options:
        - Not a work or school account
        - Yes, I'm an administrator
        - No, but I can ask one
        - No, and my organisation won't approve new apps
  - type: dropdown
    id: size
    attributes:
      label: Roughly how much mail?
      options:
        - Under 10,000 messages
        - 10,000 to 50,000
        - 50,000 to 200,000
        - Over 200,000
        - Don't know
  - type: dropdown
    id: devices
    attributes:
      label: How many devices could you use it on?
      options:
        - "1"
        - "2"
        - 3 or more
  - type: textarea
    id: use
    attributes:
      label: What do you use mail for most? (optional)
      description: e.g. lots of shared mailboxes, many meetings, many folders and rules. No names, please.
  - type: checkboxes
    id: credit
    attributes:
      label: Credit (optional)
      options:
        - label: "Credit me in About › Testers once I've tested a release. My GitHub username (or the display name below) is built into later releases; I can ask to be left out of future ones, but copies already published keep it."
          required: false
  - type: input
    id: display_name
    attributes:
      label: Display name for the credit
      description: Optional. Without one you're credited as @your-github-username.
  - type: checkboxes
    id: agree
    attributes:
      label: Understood
      options:
        - label: I'll report problems as GitHub issues, and I've put nothing private in this one.
          required: true
