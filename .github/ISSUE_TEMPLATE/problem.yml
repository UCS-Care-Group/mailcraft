name: Report a problem
description: Something went wrong, was lost, crashed, or doesn't match Outlook on the web.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is **public**. Don't paste messages, addresses, names or anything from your mail. Describe what happened in your own words, with invented examples if you need them.

        Have a fix? Open the pull request now, with `Closes #` and this issue's number, rather than offering to fix it. No need to wait for a yes (CONTRIBUTING.md).
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Something I had is gone or changed without my asking (data loss)
        - MailCraft closed by itself (crash)
        - MailCraft and Outlook on the web disagree (out of step)
        - Something else doesn't work
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MailCraft version
      description: File › About MailCraft, or the release you installed.
      placeholder: e.g. 0.2.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Windows 11 x64, macOS 15 Apple silicon, Fedora 42 KDE
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Account
      options:
        - Personal Microsoft account
        - Work or school Microsoft 365 account
        - Other (IMAP)
        - None (local or sample mailbox)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The steps, as exactly as you can.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "In MailCraft: Help › Copy Diagnostics, then paste here; or, from Report a Problem, drag the diagnostics file it saved into this box. It has the version, the platform and the end of the log, with addresses, names, paths, hosts, links and quoted text taken out. Read it before you submit. If MailCraft crashed, start it again first: the copy includes the run before. Version 0.3.0 and earlier don't have the button; leave this empty."
