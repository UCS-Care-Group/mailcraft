# CodeQL code scanning, in a workflow of its own rather than GitHub's default setup: default
# setup never analysed a pull request from a fork, and protection of main waits for CodeQL's
# results, so a contributor's pull request waited for ever. This one runs on every pull request,
# a fork's included once its workflows are approved, on main and weekly.
# Every language is analysed on every pull request, docs-only ones included: main's ruleset waits
# for CodeQL's results for each pull request, and a skipped analysis leaves it waiting (#396).
# What is read: .github/codeql/codeql-config.yml (test-only code is left out).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
