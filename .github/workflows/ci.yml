# The gates every change must pass: formatting, clippy with warnings as errors, the tests, asset
# attribution, crate layering, the wasm build and cargo-deny (`cargo xtask ci`), on the three desktop systems
# (clippy and wasm on Linux only). Changes to documentation alone don't run it, nor changes under
# .github/ alone (other workflows, templates, the CodeQL set-up), save to this file; `ci-ok` reports
# on every pull request either way, and is the check that protection of main requires.
name: CI

on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!**/*.md', '!.github/**', 'ATTRIBUTION.md', '.github/workflows/ci.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether a pull request changes anything but documentation (Markdown files and docs/;
  # ATTRIBUTION.md counts as code, since `cargo xtask assets` reads it) and .github/ (nothing the
  # build reads; this workflow counts as code).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE"...HEAD)
          if printf '%s\n' "$files" | grep -qvE '^docs/|^\.github/|\.md$|^$' || printf '%s\n' "$files" | grep -qxE 'ATTRIBUTION\.md|\.github/workflows/ci\.yml'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        # Pull requests read main's cache but don't write their own: a cache per PR fills the
        # repository's 10 GB and pushes out the caches that matter (FreeBSD's above all).
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Windowing and file-dialog headers the desktop app links against.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      # Clippy and the wasm check run on Linux only: wasm is the same from any host, and the
      # tests still build every platform's code.
      - run: cargo run --locked --package xtask -- ci
        env:
          XTASK_CI_SKIP: ${{ runner.os != 'Linux' && 'clippy,wasm,deny' || 'deny' }}

  # cargo-deny (deny.toml): RustSec advisories, licences, duplicate crates, sources. Its own job,
  # since it needs no build; `ci` skips the step it would otherwise run.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo run --locked --package xtask -- deny

  # The one check main's protection requires: passes when every platform passed, or when there
  # was nothing but documentation to check.
  ci-ok:
    needs: [changes, ci, deny]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
