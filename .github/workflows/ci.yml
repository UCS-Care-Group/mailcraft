# The gates every change must pass: formatting, clippy with warnings as errors, the tests, asset
# attribution, crate layering, the wasm build and cargo-deny (`cargo xtask ci`), on the three desktop systems
# (clippy and wasm on Linux only). `ci-ok` reports on every pull request, and is the check that
# protection of main requires.
#
# Two tiers (CONTRIBUTING.md › Continuous integration). A pull request runs the cheap checks in
# `quick` at once, and the tests of the packages it changes and of every package that depends on
# them (`cargo xtask affected`, a nextest filter); a translation runs on Linux alone, the Android
# app's own files and documentation run no Rust tests. A push to main, the merge queue, a run by
# hand, and a pull request labelled `full-ci` or changing what every package is built from run the
# whole suite on every system; the merge queue runs it on Linux alone.
name: CI

on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!**/*.md', '!.github/**', 'ATTRIBUTION.md', '.github/workflows/**', '.github/scripts/**']
  pull_request:
    # `labeled`: adding `full-ci` runs the whole suite at once. Any other label starts the pull
    # request's own run again (one run per head, so `ci-ok` always comes from a real one).
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  # A dropped connection to crates.io is tried again rather than failing the run.
  CARGO_NET_RETRY: 10

# A newer push to a pull request replaces its run; a run on main or in the merge queue always
# finishes, so every merged commit is tested whole.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this run covers (`cargo xtask affected`, xtask/src/affected.rs): `rust` (the matrix and
  # cargo-deny), `matrix` (Linux alone for a translation), `android_app`, `android_rust`, and
  # `filter`, the nextest filter of a pull request's tests (empty: all of them). The log and the
  # run's summary say what was selected and why.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.affected.outputs.rust }}
      matrix: ${{ steps.affected.outputs.matrix }}
      android_app: ${{ steps.affected.outputs.android_app }}
      android_rust: ${{ steps.affected.outputs.android_rust }}
      filter: ${{ steps.affected.outputs.filter }}
    steps:
      # A pull request's run checks out its merge commit: against the first parent (the tip of main
      # it was merged into), only the pull request's own changes count.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # xtask alone, shared with `quick`; written by main only.
        with:
          shared-key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - id: affected
        env:
          EVENT: ${{ github.event_name }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT" --base HEAD^1)
          if [ "$FULL_CI" = true ]; then args+=(--full-ci); fi
          cargo run --locked --package xtask -- affected "${args[@]}"

  # The checks that need no build of the workspace (seconds together): formatting, attribution,
  # SPDX lines, test files, the workflows, the layering, the browser build's clock, the
  # catalogues, and that the fragments join. On every pull request, documentation alone included,
  # beside the matrix rather than before it, so a stale catalogue fails in a few minutes and a
  # green pull request waits no longer. The matrix runs them again with the rest.
  quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # `changes`' cache, read and never written here.
        with:
          shared-key: xtask
          save-if: false
      - run: cargo run --locked --package xtask -- ci
        env:
          XTASK_CI_ONLY: fmt,assets,spdx,test-files,workflows,layers,wasm-clock,i18n,release-notes,docs-log

  ci:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # Pull requests read main's cache but don't write their own: a cache per PR fills the
        # repository's 10 GB and pushes out the caches that matter (FreeBSD's above all).
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A failed run saves nothing: a half-filled cache would stay until the key changes.
          cache-on-failure: false
      # Runs the test binaries side by side (`cargo xtask ci` uses it when it is there).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.150
      # Windowing and file-dialog headers the desktop app links against.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/apt-mirrors.sh && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      # Clippy and the wasm check run on Linux only: wasm is the same from any host, and the
      # tests still build every platform's code.
      # On a pull request, XTASK_TEST_FILTER holds the tests `changes` selected; empty, all of them.
      - run: cargo run --locked --package xtask -- ci
        env:
          XTASK_CI_SKIP: ${{ runner.os != 'Linux' && 'clippy,wasm,deny' || 'deny' }}
          XTASK_TEST_FILTER: ${{ needs.changes.outputs.filter }}

  # cargo-deny (deny.toml): RustSec advisories, licences, duplicate crates, sources. Its own job,
  # since it needs no build; `ci` skips the step it would otherwise run.
  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - run: cargo run --locked --package xtask -- deny

  # The phone binding (`mailcraft-mobile`) must keep building for Android: a check, no tests, with
  # the NDK the runner image provides. When a package it is built from changes (the engine, the
  # network crate, the model…), or the Android app, or the run covers everything (`changes`).
  android:
    needs: changes
    if: needs.changes.outputs.android_rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      # The NDK's clang for C code in the build scripts (ring) and as the linker, at Android 10's
      # level (API 29), the least the app supports.
      - name: cargo check for Android
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android29-clang"
          cargo check --locked --target aarch64-linux-android -p mailcraft-mobile

  # The Android app (`apps/mailcraft-android`): `cargo xtask mobile` builds the Rust library for
  # Android with cargo-ndk, generates the Kotlin bindings, builds the debug and release apps, runs
  # Android Lint and detekt as errors and the unit tests, checks the licences of what ships and that
  # no Play Services or Firebase is in the tree. Only when the app, the binding or the host crate
  # changes, or the run covers everything (`changes`).
  android-app:
    needs: changes
    if: needs.changes.outputs.android_app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: false
      - name: Android SDK pieces the app is built with
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: cargo xtask mobile
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"  # Paparazzi 2 runs on 21; the app still targets 17
          cargo run --locked --package xtask -- mobile

  # The one check main's protection requires (and the merge queue's): passes when every job that
  # ran passed; a job this run had no need of is skipped, and a skip counts as a pass. A failed or
  # cancelled job, `changes` included, fails it.
  ci-ok:
    needs: [changes, quick, ci, deny, android, android-app]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
