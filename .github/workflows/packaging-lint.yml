# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Pinned to a full commit SHA of the shared workflow's main branch; moved by hand, after reading the change.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@fd14193f062cd71f9de9426bd450aa0adad670f0 # main # zizmor: ignore[ref-version-mismatch]
