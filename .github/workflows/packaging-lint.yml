# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata. A release-note
# fragment alone doesn't run it (`cargo xtask ci` checks that the fragments join).
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "!packaging/release-notes.d/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "!packaging/release-notes.d/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Pinned to a full commit SHA of the shared workflow's main branch; moved by hand, after reading the change.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@d65d611f0ef67eaa94039351be5afce61102dbb0 # main # zizmor: ignore[ref-version-mismatch]
