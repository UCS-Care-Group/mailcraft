# zizmor: static analysis of the workflows themselves (unpinned actions, credentials left in a
# checkout, template injection, over-broad permissions). Findings fail the job and are in its log.
# https://docs.zizmor.sh/
name: zizmor

on:
  pull_request:
    paths: ['.github/**']
  push:
    branches: [main]
    paths: ['.github/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.0
          # Results in the log rather than the Security tab: a pull request from a fork has no
          # permission to upload them.
          advanced-security: false
