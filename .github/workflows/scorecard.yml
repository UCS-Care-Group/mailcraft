# OpenSSF Scorecard: checks this repository's supply-chain practices (pinned dependencies, branch
# protection, token permissions, …) and publishes the result for the README's badge and the
# Security tab. From the template of ossf/scorecard-action.
name: Scorecard supply-chain security

on:
  # For the Branch-Protection check; only the default branch is supported.
  branch_protection_rule:
  schedule:
    - cron: '27 4 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; the job asks for what the action needs and no more.
permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      # Read the repository and its workflows' runs (the checks look at both).
      contents: read
      actions: read
      # Upload the results to code scanning.
      security-events: write
      # Publish the results and get a badge (OIDC to the Scorecard API).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
