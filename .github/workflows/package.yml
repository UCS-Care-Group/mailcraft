name: Package

# Builds every release file with the scripts in packaging/ and uploads them as workflow artifacts
# named release-* (release.yml gathers them into one GitHub release). Called by release.yml; it
# doesn't run on its own. Everything here runs on GitHub's standard runners, so it works in any
# public repository, a fork included.
#
# File names follow the Craft apps' releases, which is what lets ArtCraft Launcher find them:
#   mailcraft-<ver>-windows-{x64,x86,arm64}.msi, mailcraft-<ver>-windows-{x64,x86,arm64}-portable.zip
#   mailcraft-<ver>-macos-universal.dmg, mailcraft-cli-<ver>-macos-universal.zip
#   mailcraft-<ver>-linux-{x86_64,aarch64}.{AppImage,AppImage.zsync,deb,rpm,tar.gz,flatpak}
#   mailcraft-<ver>-freebsd-x86_64.tar.gz, mailcraft-web-<ver>.zip

on:
  workflow_call:
    inputs:
      freebsd:
        description: "Also build the FreeBSD tarball (in a VM; slow)"
        type: boolean
        required: false
        default: true
      sign:
        description: "Sign the Windows and macOS builds, in the protected `release` environment (pushed version tags only)"
        type: boolean
        required: false
        default: false
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ENDPOINT:
        required: false
      AZURE_SIGNING_ACCOUNT:
        required: false
      AZURE_CERT_PROFILE:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  WIX_VERSION: "5.0.2"
  NFPM_VERSION: "2.47.0"

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    # Signing runs in the protected `release` environment, which holds the signing secrets and
    # accepts version tags only; an unsigned build names no environment and gets no secrets.
    environment: ${{ inputs.sign && 'release' || '' }}
    steps:
      - name: Signing only for a pushed version tag
        if: inputs.sign && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          echo "::error::signing was asked for on $GITHUB_REF ($GITHUB_EVENT_NAME); only a pushed version tag is signed"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      # WiX 5.0.2 and its two extensions are NuGet packages. Each is downloaded by exact version
      # and checked against the SHA-256 pinned here before anything is installed; the tool is
      # installed from the checked file. (None of the three has dependencies.)
      - name: Install WiX and its dialog and shell extensions
        shell: pwsh
        run: |
          $pins = @{
            'wix'                    = 'f30ef0c74e2a986126539c5780be93ac24e8136eaf723b1937b26272703ae173'
            'wixtoolset.ui.wixext'   = '5ef2c707614b9f70b6bbadd2d4abcb4124efee215e9b16bfbc80113079a604c7'
            'wixtoolset.util.wixext' = 'dda1cc1b4d3b2305b1246f167c6af6fcded5000be84b3bbff3dda4f442bf4740'
          }
          if ($env:WIX_VERSION -ne '5.0.2') { throw "the pinned hashes are for WiX 5.0.2, not $env:WIX_VERSION" }
          $dir = Join-Path $env:RUNNER_TEMP 'wix-nupkg'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($id in $pins.Keys) {
            $file = Join-Path $dir "$id.$env:WIX_VERSION.nupkg"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$id/$env:WIX_VERSION/$id.$env:WIX_VERSION.nupkg" -OutFile $file
            $got = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
            if ($got -ne $pins[$id]) { throw "$id $env:WIX_VERSION does not match its pinned sha256 (got $got)" }
          }
          dotnet tool install --global wix --version $env:WIX_VERSION --add-source $dir
          if ($LASTEXITCODE -ne 0) { throw 'dotnet tool install wix failed' }
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'wix extension add failed' }
      - name: Build and package, unsigned (MSI and portable zip)
        if: ${{ !inputs.sign }}
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      # The compile runs first, with no secret in its environment, so no build script or macro of a
      # dependency can read the signing credentials; the signing step then packages what was built.
      - name: Build (no signing secrets here)
        if: inputs.sign
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -BuildOnly
      - name: Sign and package (MSI and portable zip)
        if: inputs.sign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -SkipBuild
      # The installer for real, on the one architecture this runner is: files in place, the
      # program listed, the command-line program answering, and nothing left after uninstalling.
      - name: Install, check and uninstall the MSI (x64 only)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $msi = (Get-Item dist/release/*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "$env:RUNNER_TEMP\install.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 60; throw "install failed ($($p.ExitCode))" }
          $dir = Join-Path $env:ProgramFiles 'MailCraft'
          foreach ($f in 'mailcraft.exe', 'mailcraft-cli.exe') { if (-not (Test-Path (Join-Path $dir $f))) { throw "$f missing in $dir" } }
          & (Join-Path $dir 'mailcraft-cli.exe') --version
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -eq 'MailCraft' }
          if (-not $entry) { throw 'no installed-programs entry named MailCraft' }
          $entry | Format-List DisplayName, DisplayVersion, Publisher, PSChildName
          if (-not (Get-ItemProperty 'HKLM:\SOFTWARE\RegisteredApplications').MailCraft) { throw 'MailCraft is not offered as a mail program' }
          $p = Start-Process msiexec.exe -ArgumentList @('/x', $entry.PSChildName, '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed ($($p.ExitCode))" }
          if (Test-Path (Join-Path $dir 'mailcraft.exe')) { throw 'uninstall left mailcraft.exe behind' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS universal
    runs-on: macos-latest
    # As for Windows: signing secrets only in the `release` environment, for a version tag.
    environment: ${{ inputs.sign && 'release' || '' }}
    steps:
      - name: Signing only for a pushed version tag
        if: inputs.sign && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "::error::signing was asked for on $GITHUB_REF ($GITHUB_EVENT_NAME); only a pushed version tag is signed"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # Signed builds compile first, with no secret in the environment and before the certificate is
      # imported, so no build script or macro of a dependency can read the signing credentials.
      - name: Build (no signing secrets here)
        if: inputs.sign
        run: bash packaging/macos/package.sh --arch universal --build-only
      # With the signing secrets set, the app is signed with the Developer ID and notarized;
      # without them (an unsigned build, or none in the environment) it is ad-hoc signed and the
      # script says so.
      - name: Import the signing certificate
        if: inputs.sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then bash packaging/macos/import-cert.sh; else echo "no signing certificate: ad-hoc signing"; fi
      - name: Build and package, ad-hoc signed (.app in a .dmg, CLI zip)
        if: ${{ !inputs.sign }}
        run: bash packaging/macos/package.sh --arch universal
      - name: Sign and package (.app in a .dmg, CLI zip)
        if: inputs.sign
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/macos/package.sh --arch universal --skip-build
      - name: Check the .dmg
        run: |
          dmg=$(ls dist/release/*-macos-universal.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          app="$mnt/MailCraft.app"
          # The app as somebody gets it: the signature holds for the copy in the image too. When
          # it doesn't, say what the image attached to which file.
          if ! codesign --verify --deep --strict --verbose=4 "$app"; then
            echo "::group::What is attached to the files in the image"
            xattr -lr "$app" || true
            ls -laO@ "$mnt" "$app" "$app/Contents" "$app/Contents/MacOS" "$app/Contents/Resources" || true
            echo "::endgroup::"
            hdiutil detach "$mnt" || true
            exit 1
          fi
          plutil -p "$app/Contents/Info.plist" | grep -E "CFBundleIdentifier|CFBundleIconFile|CFBundleShortVersionString"
          lipo -info "$app/Contents/MacOS/MailCraft"
          "$app/Contents/MacOS/MailCraft" --version
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux ${{ matrix.arch }}
    # The oldest supported Ubuntu image: binaries built against its glibc (2.35) run on newer ones.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries and packaging tools
        env:
          DEB_ARCH: ${{ matrix.deb }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            desktop-file-utils appstream zsync file xvfb libxkbcommon-x11-0 libegl1 mesa-vulkan-drivers
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${DEB_ARCH}.deb"
          case "${NFPM_VERSION}:${DEB_ARCH}" in
            2.47.0:amd64) expected=3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97 ;;
            2.47.0:arm64) expected=27419eb382695a7942be8ad52259f3ec1854fad001b3ae4baed34ce39a223b97 ;;
            *) echo "::error::no checksum for nfpm ${NFPM_VERSION} ${DEB_ARCH}"; exit 1 ;;
          esac
          echo "$expected  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: bash packaging/linux/package.sh
      # The .deb for real: installed with its dependencies, the window started on a virtual
      # display, and removed again.
      - name: Install, start and remove the .deb
        run: |
          dpkg-deb --info dist/release/*.deb
          sudo apt-get install -y ./dist/release/*.deb
          mailcraft-cli --version
          desktop-file-validate /usr/share/applications/*mailcraft.desktop
          MAILCRAFT_NO_PREFS=1 timeout 20 xvfb-run -a mailcraft --sample >"$RUNNER_TEMP/window.log" 2>&1 || code=$?
          # Still running when the time was up (124) is what a window that started looks like.
          if [ "${code:-0}" != 124 ]; then cat "$RUNNER_TEMP/window.log"; echo "::error::the window did not stay up (exit ${code:-0})"; exit 1; fi
          sudo apt-get remove -y mailcraft
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the Flatpak bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -- dist/linux/mailcraft-*-linux-"$ARCH".tar.gz
          if [ ! -f "$1" ]; then echo "::error::no tar.gz for $ARCH in dist/linux"; exit 1; fi
          bash packaging/linux/flatpak-bundle.sh "$1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: error
          retention-days: 30

  freebsd:
    name: FreeBSD x86_64
    if: inputs.freebsd
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and package in a FreeBSD VM
        # A FreeBSD build that fails doesn't hold back the other platforms: the release then has
        # no FreeBSD tarball, and this step shows as failed.
        continue-on-error: true
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          usesh: true
          cpu: 4
          mem: 12288
          prepare: |
            pkg install -y bash git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader fontconfig freetype2
            # rustup-init 1.29.1, pinned and checked before it runs:
            # https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-freebsd/rustup-init
            curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-freebsd/rustup-init
            [ "$(sha256 -q /tmp/rustup-init)" = af29791be32fd2f926865a983edc97f452078e6d1b4a6037d12ca2f8e67ffa3d ] || { echo "rustup-init does not match its pinned sha256"; exit 1; }
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --profile minimal --default-toolchain 1.98.1
          run: |
            set -e
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "*"
            export CARGO_TARGET_DIR=/var/tmp/mailcraft-target CARGO_BUILD_JOBS=4
            bash packaging/freebsd/package.sh
            rm -rf /var/tmp/mailcraft-target
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-freebsd-x86_64
          path: dist/release/*
          if-no-files-found: warn
          retention-days: 30

  web:
    name: Web (wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      # Pinned trunk and wasm-bindgen releases (prebuilt, checked by install-action against its
      # own checksums). wasm-bindgen must be the version in Cargo.lock: trunk runs offline below,
      # so a mismatch fails the build instead of trunk downloading one.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: trunk@0.21.14,wasm-bindgen@0.2.129
      # wasm-opt from binaryen version_123 (the one trunk 0.21.14 asks for), pinned and checked:
      # https://github.com/WebAssembly/binaryen/releases/tag/version_123
      - name: Install wasm-opt
        run: |
          url=https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" "$url"
          echo "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_123/bin" >>"$GITHUB_PATH"
      - name: Fetch the crates
        run: cargo fetch --locked
      # Offline: trunk uses the tools installed above and downloads nothing itself.
      - name: Build and zip the web app
        env:
          TRUNK_OFFLINE: "true"
        run: bash packaging/web/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
