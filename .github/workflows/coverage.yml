# Test coverage (cargo-llvm-cov) of the workspace's tests, sent to Codecov. Informational only: it
# is not a required check, a failed upload never fails the run, and codecov.yml makes Codecov's own
# status checks informational too. Documentation alone doesn't run it.
name: Coverage

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/**', '!.github/workflows/coverage.yml']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '.github/**', '!.github/workflows/coverage.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # A dropped connection to crates.io is tried again rather than failing the run.
  CARGO_NET_RETRY: 10

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # Instrumented builds differ from `ci`'s, so they have a cache of their own, written by main only.
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov@0.8.7
      # Windowing and file-dialog headers the desktop app links against.
      - name: Linux build dependencies
        run: .github/scripts/apt-mirrors.sh && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      # The same tests as `cargo xtask ci` runs (the whole workspace); the doc-tests aren't counted.
      # A test that fails here still gives its coverage: the instrumented build is several times
      # slower, so timing bounds meant for a debug build can trip, and whether tests pass is
      # `ci`'s to say, not this report's.
      - name: Run the tests with coverage
        run: cargo llvm-cov --workspace --locked --ignore-run-fail --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 3

  # The upload is a job of its own: the one with the token builds nothing and runs nothing that
  # was built (`cargo xtask workflows`, docs/releasing.md). A pull request from a fork has no
  # token; the upload then goes tokenless where Codecov allows it, and never fails the run.
  upload:
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lcov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
