name: Android

# Builds the Android app's release files (apps/mailcraft-android) and, for a pushed version tag with
# the owner's upload key in the `release` environment, signs them. Called by release.yml; it
# doesn't run on its own. The same shape as package.yml:
#
#   build  no secret. cargo-ndk, the Rust library, Gradle: an unsigned release APK and AAB, kept as
#          the workflow artifact android-unsigned and handed on by digest (packaging/ci/handoff.sh).
#   sign   the protected `release` environment, for a pushed version tag only. Checks the digest,
#          decodes the upload keystore to the runner's temp folder, signs the APK (zipalign,
#          apksigner) and the AAB (jarsigner) with the SDK's own tools, verifies both, deletes the
#          keystore, and hands the signed APK on as release-android (release.yml adds it to the
#          GitHub release and its checksums). It never runs cargo, Gradle or a built program, and
#          Gradle holds no key: the signing configuration is not in the build at all. The signed
#          AAB is handed on by digest as android-signed-aab.
#   uploader  no secret. Builds our own Play uploader (`cargo xtask play-upload`) and hands it on
#          by digest.
#   play   the `release` environment, the Play key alone. Checks both digests and runs the uploader:
#          the signed AAB to Google Play's internal track as a draft (the upload key; Play re-signs
#          with the app signing key it holds) when PLAY_SERVICE_ACCOUNT_JSON is there. No third
#          party's action holds the Play key, and a Play failure never fails the Android run.
#
# Without the upload key the build stays unsigned: the files are kept as workflow artifacts, a
# notice says so, and nothing is signed or uploaded. This workflow can't fail the desktop release:
# release.yml's publish job takes release-android only when this one succeeded.

on:
  workflow_call:
    inputs:
      sign:
        description: "Sign the build, in the protected `release` environment (pushed version tags only)"
        type: boolean
        required: false
        default: false
    secrets:
      ANDROID_UPLOAD_KEYSTORE_BASE64:
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false
    outputs:
      digest:
        description: "The digest of release-android's list of files (empty when nothing was signed)"
        value: ${{ jobs.sign.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    name: Build (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.seal.outputs.digest }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android
      - id: v
        name: Version and version code
        run: |
          set -euo pipefail
          . packaging/env.sh
          # Each version its own code, rising in release order (1.2.3-rc.1 < 1.2.3-rc.2 < 1.2.3):
          # worked out and tested in one place, xtask/src/version_code.rs. A version without one
          # (another kind of prerelease, a number too big) stops the build here.
          code="$(cargo run --locked --quiet --package xtask -- version-code "$VERSION")"
          { echo "version=$VERSION"; echo "code=$code"; } >>"$GITHUB_OUTPUT"
      - name: Android SDK pieces the app is built with
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Release APK and AAB, unsigned
        env:
          VERSION: ${{ steps.v.outputs.version }}
          CODE: ${{ steps.v.outputs.code }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"  # Paparazzi 2 needs 21 to configure; the app still targets 17
          cd apps/mailcraft-android
          ./gradlew --console=plain --no-daemon -PversionName="$VERSION" -PversionCode="$CODE" \
            :app:assembleRelease :app:bundleRelease
      - name: Hand the files on by digest
        id: seal
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          out=apps/mailcraft-android/app/build/outputs
          mkdir -p handoff
          cp "$out/apk/release/app-release-unsigned.apk" "handoff/mailcraft-$VERSION-android-unsigned.apk"
          cp "$out/bundle/release/app-release.aab" "handoff/mailcraft-$VERSION-android-unsigned.aab"
          echo "digest=$(bash packaging/ci/handoff.sh seal handoff android-unsigned)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: handoff/
          if-no-files-found: error

  sign:
    name: Sign (upload key)
    needs: [build]
    if: inputs.sign
    runs-on: ubuntu-24.04
    # The protected `release` environment holds the upload key and accepts version tags only.
    environment: release
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.seal.outputs.digest }}
      aab: ${{ steps.seal-aab.outputs.digest }}
    steps:
      - name: Signing only for a pushed version tag
        if: "!(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))"
        run: |
          echo "::error::signing was asked for on $GITHUB_REF ($GITHUB_EVENT_NAME); only a pushed version tag is signed"
          exit 1
      # The scripts come from the tagged commit, not from the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned
      - name: The files are the ones build made
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: bash packaging/ci/handoff.sh check unsigned "android-unsigned=$DIGEST"
      - name: Upload key set up?
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$ALIAS" ]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::The Android upload key is not in the release environment (ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS): the Android files stay unsigned, as the android-unsigned workflow artifact, and nothing goes to the release or to Google Play"
          fi
      - name: Sign the APK and the AAB
        if: steps.key.outputs.configured == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          # Without its own password the key has the store's.
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD || secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -name '36.*' | sort -V | tail -n 1)"
          ks="$RUNNER_TEMP/upload.keystore"
          trap 'rm -f -- "$ks"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode >"$ks"
          mkdir -p apk aab
          for f in unsigned/mailcraft-*-android-unsigned.apk; do
            name="$(basename "$f" | sed 's/-unsigned\.apk$/.apk/')"
            # 16 KB page alignment (zipalign -P 16), then the v2/v3 signature.
            "$tools/zipalign" -f -P 16 4 "$f" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$ALIAS" \
              --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "apk/$name" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" verify --verbose "apk/$name" | head -n 8
            rm -f -- "$RUNNER_TEMP/aligned.apk" "apk/$name.idsig"
          done
          for f in unsigned/mailcraft-*-android-unsigned.aab; do
            name="$(basename "$f" | sed 's/-unsigned\.aab$/.aab/')"
            cp -- "$f" "$RUNNER_TEMP/$name"
            jarsigner -keystore "$ks" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD \
              -digestalg SHA-256 "$RUNNER_TEMP/$name" "$ALIAS" >/dev/null
            jarsigner -verify "$RUNNER_TEMP/$name" | head -n 2
            mv -- "$RUNNER_TEMP/$name" "aab/$name"
          done
      - name: Delete the keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/upload.keystore"
      - name: Hand the signed APK on by digest
        id: seal
        if: steps.key.outputs.configured == 'true'
        run: echo "digest=$(bash packaging/ci/handoff.sh seal apk release-android)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.configured == 'true'
        with:
          name: release-android
          path: apk/
          if-no-files-found: error
      # The AAB is for Google Play only: not a file of the GitHub release, so not a release-* artifact.
      - name: Hand the signed AAB on by digest
        id: seal-aab
        if: steps.key.outputs.configured == 'true'
        run: echo "digest=$(bash packaging/ci/handoff.sh seal aab android-signed-aab)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.configured == 'true'
        with:
          name: android-signed-aab
          path: aab/
          if-no-files-found: error

  # Our own uploader (`cargo xtask play-upload`, xtask/src/play_upload.rs), built here without any
  # secret from the tagged commit's locked dependencies and handed on by digest: the job that holds
  # the Play key runs it and builds nothing.
  uploader:
    name: Build the Google Play uploader (holds no secret)
    if: inputs.sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.seal.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
      - name: Build xtask
        run: cargo build --locked --release --package xtask
      - name: Hand it on by digest
        id: seal
        run: |
          mkdir -p uploader
          cp target/release/xtask uploader/xtask
          echo "digest=$(bash packaging/ci/handoff.sh seal uploader play-uploader)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-uploader
          path: uploader/
          if-no-files-found: error

  # The signed AAB to Google Play's internal track, as a draft the owner promotes in Play Console.
  # This job holds the Play service account's key and nothing else: not the upload key, no cargo,
  # no Rust toolchain, no cache; it runs only the uploader handed on above (`cargo xtask workflows`
  # allows that one program here, and nothing else built). A Play failure (the app not made there
  # yet, a code already used) is a warning: the job may fail without failing the Android run, so
  # the signed APK still joins the GitHub release and the desktop release is not held up.
  play:
    name: Google Play (internal track)
    needs: [sign, uploader]
    if: needs.sign.outputs.aab != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    # The protected `release` environment holds the Play key and accepts version tags only.
    environment: release
    permissions:
      contents: read
    steps:
      - name: Only for a pushed version tag
        if: "!(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))"
        run: |
          echo "::error::the Play upload was asked for on $GITHUB_REF ($GITHUB_EVENT_NAME); only a pushed version tag is uploaded"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-signed-aab
          path: aab
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: play-uploader
          path: uploader
      - name: The files are the ones their jobs made
        env:
          AAB: ${{ needs.sign.outputs.aab }}
          UPLOADER: ${{ needs.uploader.outputs.digest }}
        run: |
          bash packaging/ci/handoff.sh check aab "android-signed-aab=$AAB"
          bash packaging/ci/handoff.sh check uploader "play-uploader=$UPLOADER"
          chmod +x uploader/xtask
      - name: Google Play set up?
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not in the release environment: the signed AAB is kept as the android-signed-aab workflow artifact and not uploaded to Google Play"
          fi
      # The key goes to the uploader in its environment only; it is never on a command line, in a
      # file or in a log, and an error names the step and the HTTP status alone.
      - name: Upload the AAB to Google Play (internal track, draft)
        if: steps.play.outputs.configured == 'true'
        continue-on-error: true
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          shopt -s nullglob
          files=(aab/*.aab)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::warning::expected one signed AAB, found ${#files[@]}"
            exit 1
          fi
          uploader/xtask play-upload "${files[0]}" || {
            echo "::warning::the AAB didn't reach Google Play; it is kept as the android-signed-aab workflow artifact"
            exit 1
          }
