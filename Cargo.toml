[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/mailcraft", "apps/mailcraft-cli", "xtask"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/UCS-Care-Group/mailcraft"

[workspace.dependencies]
# internal
mailcraft-time = { path = "crates/time" }
mailcraft-charset = { path = "crates/charset" }
mailcraft-link = { path = "crates/link" }
mailcraft-names = { path = "crates/names" }
mailcraft-i18n = { path = "crates/i18n" }
mailcraft-model = { path = "crates/model" }
mailcraft-html = { path = "crates/html" }
mailcraft-mime = { path = "crates/mime" }
mailcraft-ical = { path = "crates/ical" }
mailcraft-vcard = { path = "crates/vcard" }
mailcraft-pst = { path = "crates/pst" }
mailcraft-openpgp = { path = "crates/openpgp" }
mailcraft-smime = { path = "crates/smime" }
mailcraft-proto = { path = "crates/proto" }
mailcraft-assuan = { path = "crates/assuan" }
mailcraft-jmap = { path = "crates/jmap" }
mailcraft-dav = { path = "crates/dav" }
mailcraft-ews = { path = "crates/ews" }
mailcraft-net = { path = "crates/net" }
mailcraft-engine = { path = "crates/engine" }
mailcraft-mcp = { path = "crates/mcp" }
mailcraft-control-key = { path = "crates/control-key" }
mailcraft-host = { path = "crates/host" }
mailcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
tempfile = "3.27"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
# Runtime-generated loopback certificates for tests only.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
base64 = "0.23"
# Character sets by the WHATWG Encoding Standard, for mail in any of the sets it names
# (windows-1250, iso-8859-2, koi8-r, shift_jis, iso-2022-jp…), and vCard files: `mailcraft-charset`.
# (Apache-2.0 OR MIT) AND BSD-3-Clause, Rust throughout, builds for the browser.
encoding_rs = "0.8"
# Time zones: the IANA Time Zone Database compiled in (`tzdb-bundle-always`: the same rules on
# every platform and in the browser) and the system's own zone. Unlicense OR MIT; the database is
# in the public domain. Used by `mailcraft-time` only, which wraps it (`Zone`); calendar maths is
# our own.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }

# Unicode's word boundaries (UAX #29), for Review › Word Count (`mailcraft-engine`). MIT OR
# Apache-2.0, Rust throughout, builds for the browser; already in the tree (egui runs on it).
unicode-segmentation = "1.13"

# network (desktop and CLI only; the browser can't open sockets)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Server certificates are checked by the operating system's own verifier (#501): Windows and macOS
# trust what the system trusts (and may fetch a missing intermediate themselves); Linux and
# FreeBSD read the system's certificate store. No default features: rustls with `ring`, as above.
rustls-platform-verifier = { version = "0.7.1", default-features = false }
# The certification authorities Windows trusts for secure mail, read from its certificate store
# with the uses Windows keeps for each, for checking S/MIME Digital signatures (#30,
# `mailcraft-net`'s `system_trust_anchors`). MIT; already in the tree on Windows (rustls's).
schannel = "0.1.30"
# SHA-256 and random bytes for the OAuth sign-in (already in the tree: rustls runs on it).
ring = "0.17"
# The flag that opens a file without waiting (`O_NONBLOCK`), so that a pipe put where a file was
# named can't hold the window (#505). Constants only (already in the tree).
libc = "0.2"
# The machine's physical memory on Windows, which sets how much of a mailbox is read into memory
# (`mailcraft-engine`, `store`): a safe call, where the system's own needs `unsafe`. MIT; the
# `system` part alone. Windows only: Linux, macOS and FreeBSD read it themselves.
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
# gzip and deflate, for a picture a web server sends packed (already in the tree: the PNG decoder
# runs on it); the backend written in Rust.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# An XML reader, for the one document Microsoft Graph hands over as XML (the cached
# configuration of Outlook on the web, of which the list of Favorites is read:
# `mailcraft-net`'s `graph::favorites`). MIT, Rust throughout, and nothing but `memchr` under it. It reads no DTD and expands no entity: a reference in the text is handed over as such.
# Already in the tree (a build tool of the Linux windowing crates uses it); desktop and CLI only.
quick-xml = { version = "0.42", default-features = false }
# NTLMv2 sign-in to Exchange servers (#252, E4), written from MS-NLMP: MD4 (the hash of the
# password), MD5 and HMAC. RustCrypto, pure Rust, MIT OR Apache-2.0, and wasm-clean; `hmac` is
# already in the tree. Used by `mailcraft-ews` only.
md4 = { version = "0.11", default-features = false }
md-5 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }

# S/MIME Digital signatures checked (#30, `mailcraft-smime` only): CMS (RFC 5652) and X.509
# (RFC 5280) read with RustCrypto's DER types, and RSA (PKCS #1 v1.5, PSS) and ECDSA (P-256,
# P-384) signatures over SHA-2 checked with its implementations. Apache-2.0 OR MIT, pure Rust,
# builds for the browser; nothing random and no private key is used (checking only). `cms` has
# no release past 0.3.0-rc.2 for this generation of `der` and `x509-cert`, so it is pinned exactly.
cms = { version = "=0.3.0-rc.2", default-features = false }
x509-cert = { version = "0.3", default-features = false }
der = { version = "0.8", default-features = false, features = ["alloc", "oid"] }
spki = { version = "0.8", default-features = false, features = ["alloc"] }
const-oid = { version = "0.10", default-features = false, features = ["db"] }
rsa = { version = "0.10", default-features = false, features = ["encoding", "pkcs1v15"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
sha2 = { version = "0.11", default-features = false, features = ["oid"] }
# A PKCS #12 file opened for the window to import (#30 R13), in `mailcraft-smime`: only its key
# derivation (RFC 7292 Appendix B, the `kdf` feature); the file's layout is read by our own code.
# It has no release past 0.2.0-rc.0 for this generation of `digest` (0.11), as `cms` above, so it
# is pinned exactly; it builds for the browser.
pkcs12 = { version = "=0.2.0-rc.0", default-features = false, features = ["kdf"] }
# OpenPGP (RFC 9580): checking Digital signatures and reading Public keys (#30), in
# `mailcraft-openpgp` only. rPGP, MIT OR Apache-2.0, Rust throughout, builds for the browser
# (`wasm` there, for the random numbers its dependencies ask for). Pinned: a new version is read
# and its fixed vectors run before it comes in. No default features: bzip2 compression isn't
# needed to check a signature.
pgp = { version = "=0.21.0", default-features = false }
# The hashes rPGP itself uses (RustCrypto, MIT OR Apache-2.0, in the tree through it), named so
# that `mailcraft-openpgp` hashes what was signed once for all the keys it tries (`sha2` 0.10 and,
# for a test, `rsa` 0.9 are declared in that crate: rPGP's generation, older than S/MIME's below). The test
# vector built without rPGP signs with Ed25519 and SHA-1 fingerprints (tests only).
sha3 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false }

# images (screenshots, inline pictures). WebP for the pictures of mail that are kept as nothing
# else on the web; its decoder (image-webp) is Rust all the way down, like the others here. ICO
# (which brings BMP, the pictures inside one) for a sender's picture that is a web site's icon
# alone: everything else names the kinds it decodes (`reading::images::KINDS`).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }

# ui
egui = "0.37"
# egui's painter, at egui's version: named only to turn on its colour glyphs (#832).
epaint = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# The font reader egui uses, at egui's version: a system font is opened with it before egui is
# given it, so that egui never meets one it cannot open (#217). Already in the tree through epaint.
skrifa = "0.49"
rfd = "0.17"
arboard = { version = "3.7", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
# File and line in a backtrace or a debugger's stack, no variables: a clean test build is about a
# quarter quicker and a rebuild about a third, and target/ half the size. `debug = true` locally
# (`CARGO_PROFILE_DEV_DEBUG=true`) when a debugger needs the variables.
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

[patch.crates-io]
# winit 0.30.13 with two patches, each dropped when winit itself has it: an activation token that
# names the latest click, which KWin needs before it brings the browser forward (#144); and
# Wayland file drops plus the clipboard on winit's one data device (rust-windowing/winit#4729),
# so that files dropped on a window are attached (#523).
winit = { git = "https://github.com/UCS-Care-Group/winit", rev = "951b6c131897a80d27a925af7c5da22ea522eb0d" }
