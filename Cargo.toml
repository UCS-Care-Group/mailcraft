[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/mailcraft", "apps/mailcraft-cli", "xtask"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/billsecond/mailcraft"

[workspace.dependencies]
# internal
mailcraft-time = { path = "crates/time" }
mailcraft-model = { path = "crates/model" }
mailcraft-html = { path = "crates/html" }
mailcraft-mime = { path = "crates/mime" }
mailcraft-crypto = { path = "crates/crypto" }
mailcraft-ical = { path = "crates/ical" }
mailcraft-vcard = { path = "crates/vcard" }
mailcraft-msg = { path = "crates/msg" }
mailcraft-print = { path = "crates/print" }
mailcraft-proto = { path = "crates/proto" }
mailcraft-net = { path = "crates/net" }
mailcraft-engine = { path = "crates/engine" }
mailcraft-mcp = { path = "crates/mcp" }
mailcraft-control-key = { path = "crates/control-key" }
mailcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
base64 = "0.22"
getrandom = "0.3"
# Wiping secrets (private keys, passphrases) from memory when they are dropped. Apache-2.0 OR MIT.
zeroize = "1.8"
# Text in the character sets mail arrives in beyond Latin (Japanese, Chinese, Korean, Cyrillic,
# Central European, UTF-16...), by their WHATWG names: `mailcraft-mime`'s `charset`. (Apache-2.0
# OR MIT) AND BSD-3-Clause (the index data), Rust throughout, builds for the browser.
encoding_rs = "0.8"
# Time zones: the IANA Time Zone Database compiled in (`tzdb-bundle-always`: the same rules on
# every platform and in the browser) and the system's own zone. Unlicense OR MIT; the database is
# in the public domain. Used by `mailcraft-time` only, which wraps it (`Zone`); calendar maths is
# our own.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }

# network (desktop and CLI only; the browser can't open sockets)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# SHA-256 and random bytes for the OAuth sign-in (already in the tree: rustls runs on it).
ring = "0.17"
# gzip and deflate, for a picture a web server sends packed (already in the tree: the PNG decoder
# runs on it); the backend written in Rust.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# An XML reader, for the one document Microsoft Graph hands over as XML (the cached
# configuration of Outlook on the web, of which the list of Favorites is read:
# `mailcraft-net`'s `graph::favorites`) and for what Exchange Web Services answers (`ews`). MIT, Rust throughout, and nothing but `memchr` under
# it. It reads no DTD and expands no entity: a reference in the text is handed over as such.
# Already in the tree (a build tool of the Linux windowing crates uses it); desktop and CLI only.
quick-xml = { version = "0.41", default-features = false }

# images (screenshots, inline pictures). WebP for the pictures of mail that are kept as nothing
# else on the web; its decoder (image-webp) is Rust all the way down, like the others here.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Printing (`mailcraft-print`): the font's measurements and outlines (ttf-parser, MIT OR
# Apache-2.0, already in the tree under egui's text) and the pictures a message carries (png, MIT
# OR Apache-2.0, already in the tree under `image`). Rust throughout; both build for the browser.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
png = "0.18"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
