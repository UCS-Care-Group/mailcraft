# SonarCloud automatic analysis: what is product code and what is test material.
# The HTML corpus is hostile and real-world-shaped mail on purpose (deprecated tags, no doctype,
# tables without headers): it is test input for crates/html, not pages we serve. The fuzz corpus
# likewise. The icon generator is a developer script run by hand.
# Tests, test stand-ins and fixtures hold invented names, passwords and tokens only: they are
# analysed as tests (a file is either source or test, so they are left out of the sources).
sonar.sources=.
sonar.tests=.
sonar.exclusions=crates/html/corpus/**,fuzz/corpus/**,assets/app-icon/alternates/gen.py,**/tests.rs,**/*_tests.rs,**/tests/**,**/standin.rs,**/standin/**,**/fake.rs,apps/mailcraft/src/unconfirmed_flow.rs
sonar.test.inclusions=**/tests.rs,**/*_tests.rs,**/tests/**,**/standin.rs,**/standin/**,**/fake.rs,apps/mailcraft/src/unconfirmed_flow.rs
