[package]
name = "mailcraft-dav"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure, bounded DAV: document editing, XML readers, requests and typed answers for CalDAV and CardDAV, without sockets or browser APIs; an in-process strict stand-in server for the tests"

[lints]
workspace = true

[features]
# An in-process DAV server that holds a client to the RFCs (`standin`), for the tests of the crates
# that sit on this one. Never in a build that isn't a test's.
stand-in = []

[dependencies]
mailcraft-model = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
mailcraft-ical = { workspace = true }
mailcraft-vcard = { workspace = true }
mailcraft-time = { workspace = true }
proptest = { workspace = true }
