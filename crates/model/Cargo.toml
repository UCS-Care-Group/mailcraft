[package]
name = "mailcraft-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailCraft data model: accounts, folders, messages, contacts, calendar events with recurrence, tasks, rules and categories, with the mailbox's edit primitives and search"

[lints]
workspace = true

[dependencies]
mailcraft-i18n = { workspace = true }
mailcraft-time = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
# An account of a kind this version doesn't know is kept as its file has it, field for field, to
# be written back so (`Account::as_written`).
serde_json = { workspace = true }
thiserror = { workspace = true }
mailcraft-charset = { workspace = true }

[dev-dependencies]
mailcraft-i18n = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
