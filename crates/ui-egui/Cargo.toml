[package]
name = "mailcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MailCraft egui front end (Outlook-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
mailcraft-time = { workspace = true }
mailcraft-i18n = { workspace = true }
mailcraft-model = { workspace = true }
mailcraft-html = { workspace = true }
mailcraft-engine = { workspace = true }
mailcraft-host = { workspace = true }
# The emoji faces, behind a feature of their own since egui 0.37 (#832).
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The host a link really goes to, for its tip.
mailcraft-link = { workspace = true }
# A subject shown in a title: one line, nothing that hides or turns text (View Source).
mailcraft-names = { workspace = true }
# Window screenshots for the control channel are saved as PNG.
image = { workspace = true }
# A font is opened as egui will open it before egui is given it (`theme::is_face`): a system's
# face, and the browser's Georgian face fetched from the server.
skrifa = { workspace = true }
# A passphrase typed for importing a key, and the key file, overwritten when let go of (#30;
# already in the tree).
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Colour emoji from the system's emoji face, drawn in its own colours (#832).
epaint = { workspace = true, features = ["color_fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (the std clocks panic on wasm32).
js-sys = "0.3"

[build-dependencies]
# contributors/: the credits of About, baked in by build.rs.
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
toml = "1"
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# Messages as they come, for the reading pane's tests.
mailcraft-mime = { workspace = true }
# Errors as the host says them (#872): a real check and Send/Receive against a server on this
# machine, for the tests that show them in the interface's language.
mailcraft-net = { workspace = true }
# Synthetic .pst files for Import a .pst File's tests (the writer is a dev-only feature).
mailcraft-pst = { workspace = true, features = ["test-writer"] }
