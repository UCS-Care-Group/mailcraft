[package]
name = "mailcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MailCraft egui front end (Outlook-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
mailcraft-time = { workspace = true }
mailcraft-i18n = { workspace = true }
mailcraft-model = { workspace = true }
mailcraft-html = { workspace = true }
mailcraft-engine = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The host a link really goes to, for its tip.
mailcraft-link = { workspace = true }
# Window screenshots for the control channel are saved as PNG.
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A system font is opened as egui will open it before egui is given it (`theme::is_font`).
skrifa = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (the std clocks panic on wasm32).
js-sys = "0.3"

[build-dependencies]
# contributors/: the credits of About, baked in by build.rs.
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
toml = "1"
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
