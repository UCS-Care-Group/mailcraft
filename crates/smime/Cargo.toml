[package]
name = "mailcraft-smime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailCraft S/MIME (RFC 8551): Digital signatures checked from CMS (RFC 5652) and X.509 (RFC 5280), no I/O"

[lints]
workspace = true

[dependencies]
mailcraft-model = { workspace = true }
mailcraft-time = { workspace = true }
cms = { workspace = true }
x509-cert = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
const-oid = { workspace = true }
rsa = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
sha2 = { workspace = true }
mailcraft-charset = { workspace = true }
thiserror = { workspace = true }
# A PKCS #12 file opened for the window to import (#30 R13): its key derivation (RFC 7292
# Appendix B), PBES2 (RFC 8018) and the old triple-DES scheme, all RustCrypto of the generation
# the rest of this crate uses (`digest` 0.11, `cipher` 0.5). (`pkcs12` is pinned in the workspace.)
pkcs12 = { workspace = true }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hmac = { workspace = true }
sha1 = { version = "0.11", default-features = false }
aes = { version = "0.9", default-features = false }
des = { version = "0.9", default-features = false }
cbc = { version = "0.2", default-features = false, features = ["block-padding"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { workspace = true }
# Certificates made in the tests (example.org authorities and signers) and their keys signing.
rcgen = { workspace = true }
ring = { workspace = true }
