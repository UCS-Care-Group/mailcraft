[package]
name = "mailcraft-tnef"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailCraft reader of TNEF streams (winmail.dat, application/ms-tnef, [MS-OXTNEF]): the files and the text inside"

[features]
# The test writer (`test_writer`), for other crates' tests: a dev-dependency feature only.
test-writer = []

[lints]
workspace = true

[dependencies]
mailcraft-charset = { workspace = true }
# Windows code pages by name, and the text of compressed rich text ([MS-OXRTFCP]).
mailcraft-pst = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
