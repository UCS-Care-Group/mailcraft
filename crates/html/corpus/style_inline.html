<!DOCTYPE html>

<head>

<title>Marrowby Trust: autumn open day</title>
</head>
<body style="margin:0;padding:0;background:#f3f1ec">
<div style="max-width:600px;margin:0 auto;background:#ffffff">
  <div style="padding:20px 24px 8px 24px;font-family:Arial,sans-serif;font-size:15px;line-height:1.5;color:#2b2b2b">
    <p style="margin:0 0 12px 0"><img src="cid:quillon-mark@quillon.example" width="20" height="20" alt="Marrowby mark"> The garden opens its gates at ten, and the second planting day is signed up on the board by the shed, so there is room for everyone who wants to dig.</p>
  </div>
  <div style="font-size:0;text-align:center;padding:0 12px">
    <div style="display:inline-block;width:260px;vertical-align:top;background:#eef3fb;padding:12px 14px;font-family:Arial,sans-serif;font-size:14px;color:#1f2d3d;text-align:left">
      <b>Morning</b><br>Planting and pruning. Tools and gloves are lent.
    </div>
    <div style="display:inline-block;width:260px;vertical-align:top;background:#fbf4dc;padding:12px 14px;font-family:Arial,sans-serif;font-size:14px;color:#3d2f0b;text-align:left">
      <b>Afternoon</b><br>Tea in the greenhouse, and the seed swap at three.
    </div>
  </div>
  <div style="text-align:center;padding:16px 12px;font-family:Arial,sans-serif;font-size:14px">

    <a href="https://example.org/marrowby/map" style="display:inline-block;padding:10px 22px;margin:0 4px;border:2px solid #2f5d50;color:#2f5d50;text-decoration:none;border-radius:4px">Map</a>
