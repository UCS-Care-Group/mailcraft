[package]
name = "mailcraft-openpgp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailCraft OpenPGP checking: PGP/MIME and inline Digital signatures, attached Public keys and Autocrypt headers; no I/O of its own"

[lints]
workspace = true

[dependencies]
pgp = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Random numbers in the browser, which rPGP's dependencies ask for even when it only checks.
pgp = { workspace = true, features = ["wasm"] }

[dev-dependencies]
proptest = { workspace = true }
# Keys and signatures made in the tests, from a seed: the random numbers rPGP 0.21 takes.
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
