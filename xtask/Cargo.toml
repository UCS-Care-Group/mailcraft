[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde_json = { workspace = true }
# `cargo xtask icon` renders the app icon's SVG (the program never reads that SVG) and writes its
# PNGs, with the renderer the reading pane draws a message's SVG pictures with; the icon needs no
# text, fonts or embedded pictures, so none of its default features (the workspace's).
image = { workspace = true }
resvg = { workspace = true }
# `cargo xtask release-key`: the ed25519 release signature, with the same crates the program
# verifies it with (already in the tree through rustls), so the release build downloads no tool.
ring = { workspace = true }
mailcraft-charset = { workspace = true }
# `cargo xtask i18n` reads and writes the interface's catalogues with the program's own reader.
mailcraft-i18n = { workspace = true }
