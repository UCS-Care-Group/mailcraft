reason = "Unmaintained notice, not a vulnerability: zvariant was merged into zbus 6; zbus 5 waits on accesskit/atspi and secret-service"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
reason = "Unmaintained notice, not a vulnerability: zbus_names was merged into zbus 6; zbus 5 waits on accesskit/atspi and secret-service"

[[IgnoredVulns]]
