# Flatpak manifest for the single-file bundle attached to every GitHub release
# (mailcraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (mailcraft-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# io.github.billsecond.mailcraft.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: io.github.billsecond.mailcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: mailcraft
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Mail servers (IMAP, SMTP).
  - --share=network
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked files work anywhere without broad
  # filesystem access. Documents and Pictures are granted so files passed by path (the command
  # line, Open Recent, "Save" next to the original) work in the usual places.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  # Remembered passwords and sign-ins: the Secret Service (GNOME Keyring, KWallet) on the
  # session bus. Without it MailCraft asks for the password at each start.
  - --talk-name=org.freedesktop.secrets
  # Notifications for new mail and reminders (the freedesktop notification service).
  - --talk-name=org.freedesktop.Notifications
  # Deliberately not granted: network (the optional --control server listens on 127.0.0.1 in
  # the sandbox; `flatpak override --user --share=network io.github.billsecond.mailcraft` exposes it to
  # host agents) and home/host filesystem access.
modules:
  - name: mailcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/mailcraft /app/bin/mailcraft
      - install -Dm755 bin/mailcraft-cli /app/bin/mailcraft-cli
      - install -Dm644 share/applications/io.github.billsecond.mailcraft.desktop /app/share/applications/io.github.billsecond.mailcraft.desktop
      - install -Dm644 share/mime/packages/io.github.billsecond.mailcraft.xml /app/share/mime/packages/io.github.billsecond.mailcraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/io.github.billsecond.mailcraft.metainfo.xml /app/share/metainfo/io.github.billsecond.mailcraft.metainfo.xml
      # Docs include the licences of the embedded craft-fonts (OFL-*.txt).
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/mailcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
